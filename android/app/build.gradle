apply plugin: 'com.android.application'

def releaseSigningValue = { String name ->
    def projectValue = project.findProperty(name)
    if (projectValue != null && projectValue.toString().trim()) {
        return projectValue.toString().trim()
    }
    return (System.getenv(name) ?: '').trim()
}

def releaseSigning = [
    storeFile: releaseSigningValue('LAUNCHLIFT_UPLOAD_STORE_FILE'),
    storePassword: releaseSigningValue('LAUNCHLIFT_UPLOAD_STORE_PASSWORD'),
    keyAlias: releaseSigningValue('LAUNCHLIFT_UPLOAD_KEY_ALIAS'),
    keyPassword: releaseSigningValue('LAUNCHLIFT_UPLOAD_KEY_PASSWORD'),
]
def releaseSigningValues = releaseSigning.values()
def releaseSigningConfigured = releaseSigningValues.every { it }
def releaseSigningPartiallyConfigured = releaseSigningValues.any { it } && !releaseSigningConfigured

if (releaseSigningPartiallyConfigured) {
    throw new GradleException('Release signing is only safe when all four LAUNCHLIFT_UPLOAD_* values are configured.')
}
if (releaseSigningConfigured && !file(releaseSigning.storeFile).isFile()) {
    throw new GradleException('The configured LaunchLift upload keystore file does not exist.')
}

android {
    namespace "site.chatgpt.seelenbinder.launchliftpracticeapp.android"
    compileSdk 36
    defaultConfig {
        applicationId "site.chatgpt.seelenbinder.launchliftpracticeapp.android"
        minSdkVersion 26
        // Android 16 is already the compile toolchain. Target it as well so
        // this new Google Play submission remains eligible after 31 Aug 2026.
        targetSdkVersion 36
        versionCode 15
        versionName "1.3.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (releaseSigningConfigured) {
        signingConfigs {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register('verifyReleaseSigning') {
    group = 'verification'
    description = 'Fails unless a complete LaunchLift upload-key configuration is available.'
    doLast {
        if (!releaseSigningConfigured) {
            throw new GradleException('No upload signing material is configured. Provide all LAUNCHLIFT_UPLOAD_* values on a protected build runner.')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
		dirs '../../node_modules/@capacitor/background-runner/android/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
