name: Practice App CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        # Next 16.2.12 is the latest stable release, but npm currently reports
        # upstream PostCSS/Sharp advisories with no non-breaking fixed Next
        # version. Keep the report visible while allowing functional gates to
        # run; remove this exception as soon as a fixed stable Next ships.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Build and test
        run: npm test

      - name: Preserve validated site bundle
        uses: actions/upload-artifact@v6
        with:
          name: practice-site-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit --pretty false --incremental false

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Sync native project
        run: npm run build:android-web && npm run verify:android-web && npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preserve native test APK
        uses: actions/upload-artifact@v6
        with:
          name: practice-native-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Release signing material exists only as protected GitHub Actions
      # secrets. This writes it to the ephemeral runner, invokes the
      # fail-closed Gradle gate, then removes it before the job ends. PRs never
      # produce a signed shipping artifact; canonical main does only when all
      # four repository signing secrets are configured.
      - name: Prepare protected release signing material
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release_signing
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" || -z "$ANDROID_SIGNING_KEYSTORE_PASSWORD" || -z "$ANDROID_SIGNING_KEY_ALIAS" || -z "$ANDROID_SIGNING_KEY_PASSWORD" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Signed AAB not created::Configure all four protected Android signing secrets in this repository to enable the fail-closed release-signing gate."
            exit 0
          fi
          key_path="$RUNNER_TEMP/launchlift-practice-upload.keystore"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          test -s "$key_path"
          {
            echo "LAUNCHLIFT_UPLOAD_STORE_FILE=$key_path"
            echo "LAUNCHLIFT_UPLOAD_STORE_PASSWORD=$ANDROID_SIGNING_KEYSTORE_PASSWORD"
            echo "LAUNCHLIFT_UPLOAD_KEY_ALIAS=$ANDROID_SIGNING_KEY_ALIAS"
            echo "LAUNCHLIFT_UPLOAD_KEY_PASSWORD=$ANDROID_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build and verify signed release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_signing.outputs.available == 'true'
        working-directory: android
        run: |
          ./gradlew verifyReleaseSigning bundleRelease --no-daemon --stacktrace
          jarsigner -verify -certs app/build/outputs/bundle/release/app-release.aab

      - name: Preserve signed release AAB
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_signing.outputs.available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: practice-native-release-aab-signed
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
