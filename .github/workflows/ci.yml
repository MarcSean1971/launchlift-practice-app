name: Practice App CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        # Next 16.2.12 is the latest stable release, but npm currently reports
        # upstream PostCSS/Sharp advisories with no non-breaking fixed Next
        # version. Keep the report visible while allowing functional gates to
        # run; remove this exception as soon as a fixed stable Next ships.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Build and test
        run: npm test

      - name: Preserve validated site bundle
        uses: actions/upload-artifact@v6
        with:
          name: practice-site-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit --pretty false --incremental false
